<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- base -->
  <rect width="64" height="64" rx="10" fill="#10131A"/>

  <!-- corner registration ticks -->
  <path d="M6 13 V6 H13" stroke="#3A5A78" stroke-width="2" fill="none" stroke-linecap="square"/>
  <path d="M51 6 H58 V13" stroke="#3A5A78" stroke-width="2" fill="none" stroke-linecap="square"/>
  <path d="M58 51 V58 H51" stroke="#3A5A78" stroke-width="2" fill="none" stroke-linecap="square"/>
  <path d="M13 58 H6 V51" stroke="#3A5A78" stroke-width="2" fill="none" stroke-linecap="square"/>

  <!-- reticle ring -->
  <circle cx="32" cy="32" r="15" stroke="#3A5A78" stroke-width="2.5" fill="none"/>

  <!-- crosshair ticks: bottom / left / right -->
  <line x1="32" y1="47" x2="32" y2="53" stroke="#3A5A78" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="11" y1="32" x2="17" y2="32" stroke="#3A5A78" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="47" y1="32" x2="53" y2="32" stroke="#3A5A78" stroke-width="2.5" stroke-linecap="square"/>

  <!-- accent break: top -->
  <line x1="32" y1="9" x2="32" y2="19" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round"/>

  <!-- center node -->
  <circle cx="32" cy="32" r="3.5" fill="#FF6A1A"/>
</svg>
